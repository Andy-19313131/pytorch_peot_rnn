# 改进模型配置（体裁条件因果注意力LSTM）
data:
  data_dir: "./data/"
  data_path: "./data/peot.txt"
  pickle_path: "./data/tang.npz"
  max_len: 125
  train_ratio: 0.8
  valid_ratio: 0.1
  test_ratio: 0.1

model:
  type: "ConditionalAttnLSTM"
  embedding_dim: 256
  hidden_dim: 256
  num_layers: 2
  vocab_size: null
  embedding_dropout: 0.20
  lstm_dropout: 0.30
  output_dropout: 0.20
  attention_heads: 4
  attention_dropout: 0.10
  form_tokens:
    - "<5JUE>"
    - "<7JUE>"
    - "<5LV>"
    - "<7LV>"

training:
  batch_size: 32
  num_epoch: 30
  lr: 0.001
  weight_decay: 0.0001
  optimizer: "AdamW"
  device: "auto"
  seed: 2026
  gradient_clip: 1.0
  early_stopping_patience: 5
  scheduler: "ReduceLROnPlateau"
  scheduler_factor: 0.5
  scheduler_patience: 2

generation:
  max_gen_len: 200
  strategies:
    - greedy
    - topk
    - topp
    - constrained

paths:
  checkpoint_dir: "./results/checkpoints/"
  log_dir: "./results/logs/"

flags:
  do_train: true
  do_predict: true
