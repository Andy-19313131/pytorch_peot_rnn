# 修正基线配置（修复bug后）
data:
  data_dir: "./data/"
  data_path: "./data/peot.txt"
  pickle_path: "./data/tang.npz"
  max_len: 125
  train_ratio: 0.8
  valid_ratio: 0.1
  test_ratio: 0.1

model:
  type: "PoetryModel2"
  embedding_dim: 300
  hidden_dim: 256
  num_layers: 2
  vocab_size: null

training:
  batch_size: 128
  num_epoch: 20
  lr: 0.001
  weight_decay: 0.0001
  optimizer: "AdamW"
  device: "auto"
  seed: 123
  gradient_clip: 1.0
  early_stopping_patience: 5
  scheduler: "ReduceLROnPlateau"
  scheduler_factor: 0.5
  scheduler_patience: 2

generation:
  max_gen_len: 200
  strategy: "greedy"

paths:
  checkpoint_dir: "./results/checkpoints/"
  log_dir: "./results/logs/"

flags:
  do_train: true
  do_predict: true
